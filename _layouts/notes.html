---
layout: default
---

{% include back_link.html %}

<h1>{{ page.title }}</h1>

<style>
    /* 넷플릭스 스타일 그리드 레이아웃 (PC 기본) */
    .display-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
        gap: 15px;
        padding: 20px 0;
        max-width: 800px;
        margin: 0 auto;
    }

    /* 🎯 모바일 화면 대응 (화면 너비 600px 이하일 때 한 열에 3개씩) */
    @media screen and (max-width: 600px) {
        .display-grid {
            grid-template-columns: repeat(3, 1fr); /* 정확히 3열 고정 */
            gap: 8px; /* 모바일 단말기에 맞게 간격을 살짝 축소 */
            padding: 10px 0;
        }

        /* 모바일에서는 텍스트 박스 내부 여백 및 폰트 크기 조정 */
        .random-box {
            padding: 4px;
        }
    }

    /* 포스터 카드 스타일 */
    .display-card {
        background: #141414;
        border-radius: 4px;
        overflow: hidden;
        cursor: pointer;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        position: relative;
        aspect-ratio: 2 / 3;
    }

    .display-card:hover {
        transform: scale(1.08);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        z-index: 10;
    }

    .display-poster {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    /* 랜덤 박스 (커버 없을 때) 스타일 */
    .random-box {
        display: flex !important;
        align-items: center;
        justify-content: center;
        padding: 6px;
        text-align: center;
        color: #fff;
        font-weight: 900;
        word-break: break-all;
        overflow: hidden;
    }

    .random-text {
        display: block;
        width: 100%;
        line-height: 1.1;
        transition: transform 0.3s;
    }
    
    .display-card:hover .random-text {
        transform: scale(1.05);
    }

    /* 팝업(모달) 스타일 */
    .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.85);
        z-index: 1000;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .modal-content {
        background: #181818;
        color: #fff;
        width: 100%;
        max-width: 600px;
        max-height: 85vh;
        border-radius: 8px;
        padding: 30px;
        overflow-y: auto;
        position: relative;
        box-shadow: 0 15px 30px rgba(0,0,0,0.5);
    }

    .modal-close {
        position: absolute;
        top: 15px;
        right: 20px;
        background: none;
        border: none;
        color: #aaa;
        font-size: 1.8rem;
        cursor: pointer;
    }

    .modal-close:hover {
        color: #fff;
    }

    .modal-date {
        display: block;
        font-family: 'Courier New', Courier, monospace;
        font-size: 0.85rem;
        color: #aaa;
        margin-bottom: 10px;
    }

    .modal-body {
        font-family: 'Gowun Dodum', sans-serif;
        font-size: 1.0rem;
        line-height: 1.6;
        color: #ddd;
    }
</style>

<div class="display-grid">
    {% for post in site.notes %}
    <div class="display-card" onclick="openModal('modal-{{ forloop.index }}')">
        {% if post.cover %}
            <img src="{{ post.cover | relative_url }}" alt="{{ post.title }}" class="display-poster">
        {% else %}
            <!-- 프론트매터의 title 값이 텍스트로 들어갑니다 -->
            <div class="display-poster random-box" id="random-box-{{ forloop.index }}">
                <span class="random-text" id="random-text-{{ forloop.index }}">{{ post.title }}</span>
            </div>
            <script>
                (function() {
                    const colors = ['#b71c1c', '#880e4f', '#4a148c', '#311b92', '#0d47a1', '#01579b', '#006064', '#1b5e20', '#33691e', '#bf360c', '#3e2723', '#263238'];
                    const fonts = [
                        '"Impact", fantasy',
                        '"Arial Black", Gadget, sans-serif',
                        '"Georgia", serif',
                        '"Trebuchet MS", Helvetica, sans-serif',
                        'system-ui'
                    ];
                    
                    const box = document.getElementById('random-box-{{ forloop.index }}');
                    const text = document.getElementById('random-text-{{ forloop.index }}');
                    
                    box.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    text.style.fontFamily = fonts[Math.floor(Math.random() * fonts.length)];
                    
                    // 글자 길이에 맞춰 폰트 크기 동적 조절 (테두리에 꽉 차도록)
                    const titleLength = text.innerText.length;
                    let randomSize;
                    if (titleLength <= 5) {
                        randomSize = '2.2em';
                    } else if (titleLength <= 10) {
                        randomSize = '1.6em';
                    } else {
                        randomSize = '1.2em';
                        text.style.letterSpacing = '-1px';
                    }
                    text.style.fontSize = randomSize;
                })();
            </script>
        {% endif %}
    </div>

    <!-- 팝업 창 (마크다운의 title이 제목으로 출력됨) -->
    <div id="modal-{{ forloop.index }}" class="modal-overlay" onclick="outsideClose(event, 'modal-{{ forloop.index }}')">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('modal-{{ forloop.index }}')">&times;</button>
            <span class="modal-date">{{ post.date | date: "%Y-%m-%d %H:%M" }}</span>
            <h2 style="margin-top: 10px; color: #fff;">{{ post.title }}</h2>
            <div class="modal-body">
                {{ post.content }}
            </div>
        </div>
    </div>
    {% endfor %}
</div>

<script>
    function openModal(modalId) {
        document.getElementById(modalId).style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }

    function closeModal(modalId) {
        document.getElementById(modalId).style.display = 'none';
        document.body.style.overflow = 'auto';
    }

    function outsideClose(event, modalId) {
        if (event.target.classList.contains('modal-overlay')) {
            closeModal(modalId);
        }
    }
</script>
