---
layout: default
---

{% include back_link.html %}

<h1>{{ page.title }}</h1>

<style>
    /* 넷플릭스 스타일 그리드 레이아웃 */
    .netflix-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 20px;
        padding: 20px 0;
        max-width: 900px;
        margin: 0 auto;
    }

    /* 포스터 카드 스타일 */
    .netflix-card {
        background: #141414;
        border-radius: 6px;
        overflow: hidden;
        cursor: pointer;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        position: relative;
    }

    .netflix-card:hover {
        transform: scale(1.05);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
        z-index: 10;
    }

    .netflix-poster {
        width: 100%;
        aspect-ratio: 2 / 3;
        object-fit: cover;
        display: block;
    }

    /* 랜덤 박스 스타일 */
    .random-box {
        display: flex !important;
        align-items: center;
        justify-content: center;
        padding: 10px;
        text-align: center;
        color: #fff;
        font-weight: bold;
        word-break: keep-all;
    }

    /* 팝업(모달) 스타일 */
    .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.85);
        z-index: 1000;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .modal-content {
        background: #181818;
        color: #fff;
        width: 100%;
        max-width: 600px;
        max-height: 85vh;
        border-radius: 8px;
        padding: 30px;
        overflow-y: auto;
        position: relative;
        box-shadow: 0 15px 30px rgba(0,0,0,0.5);
    }

    .modal-close {
        position: absolute;
        top: 15px;
        right: 20px;
        background: none;
        border: none;
        color: #aaa;
        font-size: 1.8rem;
        cursor: pointer;
    }

    .modal-close:hover {
        color: #fff;
    }

    .modal-date {
        display: block;
        font-family: 'Courier New', Courier, monospace;
        font-size: 0.85rem;
        color: #aaa;
        margin-bottom: 10px;
    }

    .modal-body {
        font-family: 'Gowun Dodum', sans-serif;
        font-size: 1.0rem;
        line-height: 1.6;
        color: #ddd;
    }
</style>

<div class="netflix-grid">
    {% for post in site.notes %}
    <div class="netflix-card" onclick="openModal('modal-{{ forloop.index }}')">
        {% if post.cover %}
            <img src="{{ post.cover | relative_url }}" alt="{{ post.title }}" class="netflix-poster">
        {% else %}
            <div class="netflix-poster random-box" id="random-box-{{ forloop.index }}">
                <span class="random-text">{{ post.title }}</span>
            </div>
            <script>
                (function() {
                    const colors = ['#FF5733', '#33FF57', '#3357FF', '#FF33A1', '#A133FF', '#33FFF5', '#F5FF33', '#FF8C33', '#5D4037', '#607D8B'];
                    const fonts = ['"Courier New", Courier, monospace', '"Gowun Dodum", sans-serif', '"Georgia", serif', '"Impact", sans-serif', '"Trebuchet MS", sans-serif'];
                    
                    const box = document.getElementById('random-box-{{ forloop.index }}');
                    const text = box.querySelector('.random-text');
                    
                    box.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    text.style.fontFamily = fonts[Math.floor(Math.random() * fonts.length)];
                    text.style.fontSize = (Math.floor(Math.random() * (22 - 14 + 1)) + 14) + 'px';
                })();
            </script>
        {% endif %}
    </div>

    <!-- 팝업 창 -->
    <div id="modal-{{ forloop.index }}" class="modal-overlay" onclick="outsideClose(event, 'modal-{{ forloop.index }}')">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('modal-{{ forloop.index }}')">&times;</button>
            <span class="modal-date">{{ post.date | date: "%Y-%m-%d" }}</span>
            <h2 style="margin-top: 10px; color: #fff;">{{ post.title }}</h2>
            <div class="modal-body">
                {{ post.content }}
            </div>
        </div>
    </div>
    {% endfor %}
</div>

<script>
    function openModal(modalId) {
        document.getElementById(modalId).style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }

    function closeModal(modalId) {
        document.getElementById(modalId).style.display = 'none';
        document.body.style.overflow = 'auto';
    }

    function outsideClose(event, modalId) {
        if (event.target.classList.contains('modal-overlay')) {
            closeModal(modalId);
        }
    }
</script>
