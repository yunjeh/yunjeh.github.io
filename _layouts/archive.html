---
layout: default
title: Archive
---

{% include back_link.html %}

<h1>{{ page.title }}</h1>



    <div class="post-list">
      {% for post in site.posts %}
      <div>
        {{ post.content | strip_html | strip_newlines }}
        <time class="post-date">
          {{ post.date | date: "%Y.%m.%d. %H:%M:%S" }}
        </time>
      </div>
      {% endfor %}
    </div>
